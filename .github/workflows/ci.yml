name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The browser tests are the only thing that can see layout and interaction
      # bugs: a section rendering with no spacing, a control that never shows it
      # is invalid, a sex pill that changes the value without lighting up. None
      # of those fail a typecheck or a happy-dom unit test.
      - name: Install Chromium for the browser tests
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:e2e
